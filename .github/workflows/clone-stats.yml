# Keeps the clone history behind the "Clone history" chart in the README.
# GitHub only shows 14 days of traffic, so this runs daily and appends to clones.csv on the `traffic` branch
# (a separate branch, so the daily commits stay out of main's history).
#
# Needs a repository secret TRAFFIC_TOKEN: a fine-grained personal access token limited to this repository
# with "Administration: Read-only" (the traffic API requires it). Without the secret the job does nothing.
name: clone stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the traffic branch
        run: |
          if git ls-remote --exit-code --heads origin traffic >/dev/null; then
            git fetch --depth 1 origin traffic
            git worktree add data origin/traffic
            git -C data checkout -B traffic
          else
            git worktree add --detach data
            git -C data checkout --orphan traffic
            git -C data rm -rf --quiet .
          fi

      - name: Fetch clones and redraw
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 .github/scripts/clone_chart.py data

      - name: Commit if changed
        run: |
          cd data
          git add clones.csv clones.svg 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name="Cynthia-wlan9509" -c user.email="97154374+Cynthia-wlan9509@users.noreply.github.com" \
            commit -m "clone stats $(date -u +%F)"
          git push origin traffic
